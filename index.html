<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#050505">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>川西 · 慢慢回到自己</title>
<link rel="icon" href="images/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/icon-180.png">
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ═══════════════════════════════════════════
   混沌旅行 · CHAOS TRAVEL
   赛博朋克 x 废土美学 x 故障艺术
   ═══════════════════════════════════════════ */

/* ─── TOKENS ─── */
:root {
  --asphalt:#050505; --neon:#00FF9D; --urine:#FFD300; --bruise:#6A00FF;
  --cement:#3A3A3A; --rust:#C94C4C;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}

/* ─── RESET ─── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Roboto Mono',monospace;background:var(--asphalt);color:var(--cement);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:14px;line-height:1.8;font-weight:300}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:var(--asphalt)}
::-webkit-scrollbar-thumb{background:var(--cement)}

/* ─── SCANLINES (global overlay) ─── */
body::after{content:'';position:fixed;inset:0;z-index:9999;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);opacity:.6}
/* Noise grain */
body::before{content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;opacity:.04;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* ─── TYPOGRAPHY ─── */
h1,h2,h3,.glitch{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.15em;font-weight:700;color:var(--neon)}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;height:100%}
.glitch::before{color:#f00;animation:glitchR 2s infinite linear alternate-reverse;z-index:-1}
.glitch::after{color:#00f;animation:glitchB 3s infinite linear alternate-reverse;z-index:-2}
@keyframes glitchR{0%,100%{transform:translate(0)}20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,2px)}80%{transform:translate(1px,-2px)}}
@keyframes glitchB{0%,100%{transform:translate(0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-1px,2px)}75%{transform:translate(1px,1px)}}

/* ─── APP SHELL ─── */
#app{width:100%;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
#mainContent{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:none;-webkit-overflow-scrolling:touch}
#mainContent.on{display:block}

/* ─── SPLASH ─── */
#splash{position:absolute;inset:0;z-index:100;background:var(--asphalt);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s steps(8),visibility .6s}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
#splash h1{font-family:'Oswald',sans-serif;font-size:28px;font-weight:700;letter-spacing:.2em;line-height:1.6;text-align:center;text-transform:uppercase;color:var(--neon)}
#splash .s-bar{margin-top:32px;width:120px;height:2px;background:var(--cement);overflow:hidden;position:relative}
#splash .s-bar::after{content:'';position:absolute;inset:0;background:var(--neon);animation:sBar 2s steps(12) infinite}
@keyframes sBar{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* ─── WELCOME ─── */
#welcome{position:absolute;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;padding:28px 20px;transition:opacity .4s steps(6),transform .4s}
#welcome.hide{opacity:0;transform:translateY(12px);pointer-events:none}
.w-panel{background:var(--asphalt);border:1px solid var(--neon);padding:36px 24px 28px;text-align:center;max-width:340px;width:100%;box-shadow:6px 6px 0 var(--bruise),0 0 30px rgba(0,255,157,.08);position:relative}
.w-panel>*{opacity:0;transform:translateY(10px)}
.w-panel.visible>*{animation:wUp .4s steps(8) both}
.w-panel.visible>:nth-child(1){animation-delay:.02s}.w-panel.visible>:nth-child(2){animation-delay:.07s}.w-panel.visible>:nth-child(3){animation-delay:.12s}.w-panel.visible>:nth-child(4){animation-delay:.17s}.w-panel.visible>:nth-child(5){animation-delay:.22s}
@keyframes wUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* Water stain on welcome card */
.w-panel::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 70% 30%,rgba(255,211,0,.04) 0%,transparent 60%),radial-gradient(ellipse at 30% 70%,rgba(106,0,255,.03) 0%,transparent 50%);z-index:0}
.w-panel>*{position:relative;z-index:1}

/* ─── TAB BAR (mobile pill) ─── */
#tabBar{display:none;z-index:50;position:absolute;bottom:calc(var(--safe-b) + 10px);left:50%;transform:translateX(-50%);background:var(--asphalt);padding:4px;box-shadow:0 0 0 1px var(--cement),0 4px 24px rgba(0,0,0,.6);border:1px solid var(--bruise)}
#tabBar.show{display:flex}
#tabBar .sidebar-brand{display:none}
#tabBar .sidebar-footer{display:none}
#tabBar{border-radius:2px}
.tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--cement);font-size:8px;font-weight:500;cursor:pointer;padding:7px 14px;min-width:48px;min-height:44px;transition:color .2s steps(4);-webkit-tap-highlight-color:transparent;position:relative;z-index:1;font-family:'Roboto Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.tab-item .ti-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;transition:filter .2s steps(4)}
.tab-item.active{color:var(--neon)}
.tab-item.active .ti-icon{filter:drop-shadow(0 0 4px var(--neon))}
#tabPill{position:absolute;top:4px;height:40px;background:var(--bruise);opacity:.2;transition:left .3s steps(8),width .3s steps(8);z-index:0;pointer-events:none}

/* Desktop sidebar — like a control panel */
@media(min-width:768px){
  #tabBar{display:flex!important;flex-direction:column;position:fixed;top:0;left:0;bottom:0;transform:none;width:200px;height:100%;padding:0;background:var(--asphalt);box-shadow:none;border:none;border-right:1px solid var(--cement);z-index:50;overflow-y:auto}
  #tabPill{display:none}
  #tabBar .sidebar-brand{display:flex;flex-direction:column;align-items:center;padding:24px 16px 20px;border-bottom:1px solid var(--cement)}
  #tabBar .sidebar-brand .sb-logo{width:40px;height:40px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;filter:drop-shadow(0 0 6px var(--neon))}
  #tabBar .sidebar-brand .sb-title{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;color:var(--neon);letter-spacing:.2em;text-transform:uppercase}
  #tabBar .sidebar-brand .sb-sub{font-size:9px;color:var(--cement);margin-top:2px;font-family:'Roboto Mono',monospace}
  #tabBar .sidebar-footer{display:block;margin-top:auto;padding:14px 16px;font-size:9px;color:var(--cement);text-align:center;border-top:1px solid var(--cement);font-family:'Roboto Mono',monospace}
  .tab-item{flex-direction:row;justify-content:flex-start;gap:10px;padding:11px 18px;margin:2px 0;font-size:11px;font-weight:400;min-width:auto;min-height:auto;color:var(--cement);transition:all .2s steps(4);border-left:2px solid transparent}
  .tab-item:hover{background:rgba(0,255,157,.04)}
  .tab-item.active{color:var(--neon);background:rgba(0,255,157,.06);border-left:2px solid var(--neon)}
  .tab-item .ti-icon{width:16px;height:16px}
  #mainContent{margin-left:200px;width:calc(100% - 200px)}
}
@media(min-width:1024px){#tabBar{width:220px}#mainContent{margin-left:220px;width:calc(100% - 220px)}}
@media(min-width:1400px){#tabBar{width:240px}#mainContent{margin-left:240px;width:calc(100% - 240px)}}

/* ─── PAGES ─── */
.page{display:none;padding:0 0 140px}
.page.on{display:block;animation:pageIn .35s steps(10) both}
@keyframes pageIn{from{opacity:.4;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}

/* ─── HERO IMAGE ─── */
.hero-img-wrap{position:relative;width:100%;margin:calc(var(--safe-t) * -1) 0 0;padding-top:var(--safe-t);overflow:hidden}
.hero-img-wrap img{width:100%;height:50vh;max-height:400px;object-fit:cover;display:block;filter:grayscale(.3) contrast(1.2) brightness(.8)}
.hero-gradient{position:absolute;inset:0;background:linear-gradient(to top,var(--asphalt) 0%,transparent 40%,transparent 100%);pointer-events:none}
/* RGB aberration on hero */
.hero-img-wrap::after{content:'';position:absolute;inset:0;background:inherit;mix-blend-mode:screen;opacity:.3;transform:translate(3px,0);animation:chromaShift .15s steps(2) infinite;pointer-events:none}
@keyframes chromaShift{0%,100%{transform:translate(2px,0)}50%{transform:translate(-2px,0)}}

/* ─── HOME HERO TEXT ─── */
.home-hero{text-align:left;padding:20px 18px 16px;position:relative;z-index:1}
.home-hero .hh-greeting{font-size:9px;color:var(--urine);font-weight:500;letter-spacing:.2em;display:block;margin-bottom:6px;text-transform:uppercase;font-family:'Roboto Mono',monospace}
.home-hero .hh-location{font-family:'Oswald',sans-serif;font-size:36px;font-weight:700;line-height:1.05;margin-bottom:6px;text-transform:uppercase;letter-spacing:.1em}
.home-hero .hh-capsule{display:inline-block;font-size:10px;color:var(--cement);letter-spacing:.12em;font-family:'Roboto Mono',monospace}
@media(min-width:768px){.home-hero{padding:28px 24px 20px}.home-hero .hh-location{font-size:48px}}
@media(min-width:1400px){.home-hero .hh-location{font-size:56px}}

/* ─── QUICK STATS (bento blocks) ─── */
.quick-stats-card{margin:0 14px 22px;padding:0;background:var(--asphalt);border:1px solid var(--cement);display:grid;grid-template-columns:repeat(3,1fr);position:relative;overflow:hidden}
.quick-stats-card::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(106,0,255,.03) 3px,rgba(106,0,255,.03) 6px);pointer-events:none;z-index:0}
.quick-stat{text-align:center;padding:18px 8px 14px;position:relative;z-index:1}
.quick-stat+.quick-stat{border-left:1px solid var(--cement)}
.quick-stat .qs-val{font-family:'Oswald',sans-serif;font-size:34px;font-weight:700;color:var(--neon);line-height:1;display:block;letter-spacing:.05em}
.quick-stat .qs-label{font-size:8px;color:var(--cement);margin-top:4px;font-weight:400;letter-spacing:.15em;text-transform:uppercase;font-family:'Roboto Mono',monospace}

/* ─── ORBIT / PRINCIPLES ─── */
.orbit-wrap{padding:0 4px;margin-bottom:22px}
.orbit-card{margin:0 14px 22px;padding:18px 14px 14px;background:var(--asphalt);border:1px solid var(--cement);position:relative}
.orbit-card::before{content:'';position:absolute;inset:-1px;border:1px dashed var(--bruise);opacity:.3;pointer-events:none;animation:dashFlow 4s linear infinite}
@keyframes dashFlow{to{stroke-dashoffset:-20}}
.orbit-wrap .ow-header{text-align:center;margin-bottom:6px}
.orbit-wrap .ow-header h3{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:var(--neon);text-transform:uppercase;letter-spacing:.12em}
.orbit-wrap .ow-header p{font-size:9px;color:var(--cement);margin-top:2px;font-family:'Roboto Mono',monospace;letter-spacing:.1em}
.orbit-stage{position:relative;width:260px;height:260px;margin:0 auto}
@media(min-width:640px){.orbit-stage{width:320px;height:320px}}
@media(min-width:768px){.orbit-stage{width:340px;height:340px}}
@media(min-width:1400px){.orbit-stage{width:380px;height:380px}}
.orbit-guide{position:absolute;inset:28px;border-radius:50%;border:1px dashed var(--cement);opacity:.3;pointer-events:none}
.orbit-desc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
.orbit-desc .od-text{max-width:140px;text-align:center;opacity:0;transition:opacity .25s steps(4)}
.orbit-desc .od-text.show{opacity:1}
.orbit-desc .od-word{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:var(--neon);margin-bottom:4px}
.orbit-desc .od-detail{font-size:10px;color:var(--cement);line-height:1.6;font-family:'Roboto Mono',monospace}
.orbit-track{position:absolute;inset:0}
/* Stones — keep organic feel */
.orbit-stone{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;cursor:pointer;background:var(--asphalt);border:2px solid var(--bruise);box-shadow:4px 4px 0 rgba(106,0,255,.3);-webkit-tap-highlight-color:transparent;z-index:3;user-select:none;will-change:transform;transition:scale .15s steps(4);text-transform:uppercase;color:var(--urine)}
.orbit-stone:hover{box-shadow:0 0 16px var(--neon),4px 4px 0 var(--bruise);border-color:var(--neon)}
.orbit-stone:active{scale:.9}
.orbit-stone.active{background:var(--neon)!important;color:var(--asphalt)!important;border-color:var(--neon)!important;box-shadow:0 0 24px var(--neon)!important}
.orbit-stone.pop{animation:stonePop .35s steps(6)}
@keyframes stonePop{0%{scale:1}50%{scale:1.2}100%{scale:1}}
.orbit-stone:nth-child(1){border-radius:50% 50% 46% 54%}
.orbit-stone:nth-child(2){border-radius:54% 46% 48% 52%}
.orbit-stone:nth-child(3){border-radius:46% 54% 52% 48%}
.orbit-stone:nth-child(4){border-radius:52% 48% 44% 56%}
.orbit-stone:nth-child(5){border-radius:48% 52% 54% 46%}
@media(min-width:640px){.orbit-stone{width:66px;height:66px;margin:-33px 0 0 -33px;font-size:26px}}

/* ─── ROUTE / MOUNTAIN ─── */
.route-explorer{margin:0 4px 22px}
.route-card{margin:0 14px 22px;padding:18px 14px 14px;background:var(--asphalt);border:1px solid var(--cement);position:relative}
.route-explorer .rx-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.route-explorer .rx-header h3{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;color:var(--neon);text-transform:uppercase;letter-spacing:.12em}
.route-explorer .rx-header span{font-size:9px;color:var(--cement);font-family:'Roboto Mono',monospace}
@media(min-width:768px){.route-explorer{margin:0 20px 22px}}
@media(min-width:1400px){.route-explorer{max-width:900px;margin:0 auto 24px}}
.mtn-chart-wrap{margin-top:12px}
.mtn-chart-wrap svg{width:100%;height:auto;display:block}
.mtn-fill{fill:var(--neon);opacity:.06}
.mtn-line{fill:none;stroke:var(--neon);stroke-width:2;stroke-linejoin:round;filter:drop-shadow(0 0 4px var(--neon))}
.mtn-label{fill:var(--cement);font-size:13px;text-anchor:middle;font-weight:700;font-family:'Oswald',sans-serif;letter-spacing:.1em}
.mtn-alt{fill:var(--urine);font-size:9px;text-anchor:middle;font-weight:500;font-family:'Roboto Mono',monospace}

/* ─── QUOTE ─── */
.end-quote{text-align:center;padding:24px 20px 4px;font-family:'Oswald',sans-serif;font-size:15px;line-height:2;color:var(--cement);letter-spacing:.08em}
.end-quote strong{font-weight:700;color:var(--neon)}

/* ─── CALENDAR ─── */
.cal-header{margin:0 14px 10px}
.cal-header h2{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;margin-bottom:2px;color:var(--neon)}
.cal-header p{font-size:9px;color:var(--cement);font-family:'Roboto Mono',monospace;letter-spacing:.08em}
@media(min-width:768px){.cal-header{margin:20px 20px 14px}.cal-header h2{font-size:24px}}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:0 10px 14px}
.cal-dow{text-align:center;font-size:8px;color:var(--cement);font-weight:400;padding:2px 0 6px;font-family:'Roboto Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.cal-cell{aspect-ratio:1}
.cal-cell.hidden-cell{visibility:hidden}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--asphalt);border:1px solid var(--cement);transition:all .2s steps(6);gap:1px;-webkit-tap-highlight-color:transparent;overflow:hidden;position:relative}
.cal-day .cd-num{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;line-height:1;color:var(--cement)}
.cal-day .cd-wd{font-size:7px;color:var(--cement);font-family:'Roboto Mono',monospace}
.cal-day .cd-photo{display:none}.cal-day .cd-detail{display:none}
.cal-day:not(.expanded):hover{border-color:var(--neon);box-shadow:0 0 8px rgba(0,255,157,.15)}
.cal-day.active{background:var(--neon);color:var(--asphalt);border-color:var(--neon);box-shadow:0 0 16px rgba(0,255,157,.3)}.cal-day.active .cd-num,.cal-day.active .cd-wd{color:var(--asphalt)}
.cal-day.expanded{aspect-ratio:auto;grid-column:1/-1;display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px;cursor:default;align-items:start;position:relative;overflow:visible;margin-bottom:8px;z-index:2;border:1px solid var(--neon);box-shadow:0 0 20px rgba(0,255,157,.1)}
.cal-day.expanded .cd-num{font-size:20px;position:absolute;top:8px;left:8px;z-index:2;color:var(--asphalt);text-shadow:0 0 8px var(--neon)}
.cal-day.expanded .cd-wd{position:absolute;top:30px;left:8px;z-index:2;color:var(--neon);font-size:8px}
.cal-day.expanded .cd-photo{width:110px;height:80px;object-fit:cover;display:block;filter:grayscale(.2) contrast(1.1)}
.cal-day.expanded .cd-detail{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;padding-top:2px}
.cal-day.expanded .cd-detail .cdd-title{font-size:13px;font-weight:600;line-height:1.25;color:var(--urine);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em}
.cal-day.expanded .cd-detail .cdd-moves{font-size:9px;color:var(--cement);display:flex;gap:4px;flex-wrap:wrap}
.cal-day.expanded .cd-detail .cdd-moves span{background:rgba(255,211,0,.08);padding:2px 7px;font-size:8px;color:var(--urine);font-family:'Roboto Mono',monospace}
.cal-day.expanded .cd-detail .cdd-meta{font-size:9px;color:var(--cement)}
.cal-day.expanded .cd-collapse{font-size:8px;color:var(--neon);cursor:pointer;white-space:nowrap;padding:4px 10px;border:1px solid var(--neon);background:transparent;margin-top:2px;font-weight:500;align-self:flex-start;font-family:'Roboto Mono',monospace;text-transform:uppercase;letter-spacing:.08em;transition:all .15s steps(4)}
.cal-day.expanded .cd-collapse:hover{background:var(--neon);color:var(--asphalt)}

/* Calendar collapse animation */
.cal-day .cd-photo,.cal-day .cd-detail{transition:opacity .2s steps(6),max-height .3s steps(8);max-height:0;overflow:hidden;opacity:0}
.cal-day.expanded:not(.collapsing) .cd-photo,.cal-day.expanded:not(.collapsing) .cd-detail{max-height:200px;opacity:1}
.cal-day.collapsing .cd-photo,.cal-day.collapsing .cd-detail{max-height:0!important;opacity:0}

@media(min-width:640px){.cal-grid{gap:7px;margin:0 14px 16px}}
@media(min-width:768px){.cal-grid{gap:8px;margin:0 20px 16px}.cal-day .cd-num{font-size:24px}.cal-day.expanded{grid-template-columns:140px 1fr}.cal-day.expanded .cd-photo{width:140px;height:100px}}
@media(min-width:1400px){.cal-grid{max-width:900px}.cal-day .cd-num{font-size:28px}.cal-day.expanded{grid-template-columns:180px 1fr}.cal-day.expanded .cd-photo{width:180px;height:120px}}

/* ─── DISCOVER ─── */
.disc-head{margin:0 14px 14px}
.disc-head h2{font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--neon)}
.disc-head p{font-size:9px;color:var(--cement);margin-top:2px;font-family:'Roboto Mono',monospace}
@media(min-width:768px){.disc-head{margin:20px 20px 16px}.disc-head h2{font-size:24px}}
.masonry{columns:2;column-gap:8px;padding:0 10px 20px;column-fill:balance}
@media(min-width:640px){.masonry{columns:3;column-gap:10px;padding:0 14px 24px}}
@media(min-width:768px){.masonry{columns:3;column-gap:12px;padding:0 20px 28px}}
@media(min-width:1024px){.masonry{columns:4}}
@media(min-width:1400px){.masonry{columns:5;padding:0 28px 32px}}
.masonry-item{break-inside:avoid;margin-bottom:10px;overflow:hidden;background:var(--asphalt);border:1px solid var(--cement);cursor:pointer;transition:transform .2s steps(6),box-shadow .2s steps(6);contain:layout;position:relative}

const DAYS=[{n:0,w:'周三',date:'7月8日',title:'抵达重庆',desc:'晚间抵达山城重庆，入住酒店休息。推开窗，两江的灯火在夜色中闪烁，为明天的探索养精蓄锐。',hotel:'重庆酒店',alt:'300m',moves:['晚抵重庆','入住休息','两江夜景']},{n:1,w:'周四',date:'7月9日',title:'山城经典',desc:'探索重庆的魔幻地形——解放碑的繁华、洪崖洞的璀璨、千厮门大桥的壮阔。8D城市的每一个转角都有惊喜。',hotel:'重庆酒店',alt:'300m',moves:['解放碑','洪崖洞','山城步道']},{n:2,w:'周五',date:'7月10日',title:'重庆深度',desc:'上午三峡博物馆读懂长江文明，下午在十八梯的老街巷里穿行，傍晚乘长江索道飞渡天堑。',hotel:'重庆酒店',alt:'300m',moves:['三峡博物馆','十八梯','长江索道']},{n:3,w:'周六',date:'7月11日',title:'穿楼轻轨·转场成都',desc:'上午看李子坝轻轨穿楼而过，逛鹅岭二厂文创园。午后乘高铁前往成都，傍晚入住，在巷子里找一家地道火锅。',hotel:'成都酒店',alt:'300m→500m',moves:['李子坝轻轨','鹅岭二厂','高铁赴蓉']},{n:4,w:'周日',date:'7月12日',title:'三星堆探秘',desc:'全天沉浸三星堆博物馆——青铜神树、纵目面具、黄金权杖。古蜀文明的神秘与震撼，让人忘记时间。',hotel:'成都酒店',alt:'500m',moves:['三星堆博物馆','青铜神树','古蜀文明']},{n:5,w:'周一',date:'7月13日',title:'蜀韵慢调',desc:'上午体验蜀锦织造的指尖艺术，下午在人民公园喝盖碗茶发呆，晚上看一场川剧变脸。成都的安逸，都融在这一天里。',hotel:'成都酒店',alt:'500m',moves:['蜀锦体验','人民公园','川剧变脸']},{n:6,w:'周二',date:'7月14日',title:'向高原出发',desc:'包车出发，沿318国道向西。穿过二郎山隧道就像穿过任意门，扑面而来的是高原的烈风与蓝天。傍晚抵达丹巴，甲居藏寨在夕阳下静默如诗。',hotel:'丹巴酒店',alt:'500m→1,800m',moves:['318国道西行','二郎山隧道','甲居藏寨']},{n:7,w:'周三',date:'7月15日',title:'丹巴秘境',desc:'在丹巴放慢脚步——梭坡古碉群屹立千年，中路藏寨散落在山谷。在高山峡谷间穿行，感受嘉绒藏族的文化厚度。',hotel:'丹巴酒店',alt:'1,800m',moves:['梭坡古碉','中路藏寨','藏寨休整']},{n:8,w:'周四',date:'7月16日',title:'驶向八美',desc:'驱车前往八美，海拔3500m的高原草甸豁然开朗。塔公草原在脚下无尽铺展，雅拉雪山的雪顶在天际线静静伫立。这是旅途的高潮。',hotel:'八美酒店',alt:'1,800m→3,500m',moves:['高原草甸','雅拉雪山','高原日落']},{n:9,w:'周五',date:'7月17日',title:'塔公深度',desc:'深入塔公草原——木雅大寺金色殿顶在蓝天下闪耀，塔公寺红墙斑驳。在草原上躺下来看云，高原让时间变慢，让心变轻。',hotel:'八美酒店',alt:'3,500m',moves:['木雅大寺','塔公寺','草原放空']},{n:10,w:'周六',date:'7月18日',title:'康定情歌',desc:'翻越折多山垭口——康巴第一关，海拔4298米。回望来路，318国道如丝带缠绕群山。抵达康定，跑马溜溜的山上，情歌在山谷回荡。',hotel:'康定酒店',alt:'3,500m→2,600m',moves:['折多山垭口','康定古城','高原温泉']},{n:11,w:'周日',date:'7月19日',title:'归程',desc:'从康定返回成都，一路下坡回到平原。在成都最后的晚餐后飞回上海。12天的旅程结束了，身体回到平原，心还留在高原。',hotel:'回家',alt:'2,600m→500m',moves:['返回成都','飞回上海','慢慢回到自己']}];

const PR=[{n:1,t:'慢',d:'宁愿少去一个地方，也不要多赶一次路。每天开车不超过4小时。'},{n:2,t:'早',d:'高原的清晨最美。每天7点前出发，中午最热时休息。'},{n:3,t:'水',d:'高原补水是关键。每人每天至少1.5L，车上常备保温杯。'},{n:4,t:'松',d:'不设定严格时间表。遇到喜欢的地方就停下来，让旅途自由呼吸。'},{n:5,t:'家',d:'这是一次家庭旅行，不是打卡。尊重每个人的节奏，享受在一起的时光。'}];
const PLACES=[{title:'洪崖洞夜景',loc:'重庆 · 渝中区',desc:'依山而建的吊脚楼群，入夜后灯火璀璨，仿佛千与千寻里的汤屋。站在千厮门大桥上望去，两江交汇的夜风吹过面颊，对岸霓虹如水般流动。红灯笼一串串挂满层层叠叠的屋檐，江面倒映着金色光影，恍如隔世。',tag:'经典',h:240},{title:'磁器口古镇',loc:'重庆 · 沙坪坝',desc:'千年古镇，石板路两旁是明清风格的老建筑。陈麻花的香味飘满整条街，毛血旺在锅里咕嘟咕嘟冒着热气，每一步都踩在旧时光里。沿着石阶爬上爬下，转角总能遇见意想不到的小店——卖手工糍粑的阿姨、做糖画的老爷爷。',tag:'古镇',h:180},{title:'长江索道',loc:'重庆 · 渝中',desc:'在山城有一种通勤叫飞过去。长江索道横跨1166米，日落时分乘上去，整座城市在金色光线里缓缓展开，江水在脚下奔流不息。车厢晃晃悠悠地滑过江面，对岸的高楼渐渐清晰，像在胶片电影里穿行。',tag:'体验',h:200},{title:'解放碑',loc:'重庆 · 渝中区',desc:'重庆的精神地标。环绕的摩天大楼与这座历史丰碑形成奇妙对照，八一路好吃街上酸辣粉的香气是这座城市最诚实的欢迎词。入夜后整片商圈灯火通明，奢侈品橱窗和街头小吃摊和谐共处，这就是重庆的包容。',tag:'地标',h:210},{title:'李子坝轻轨穿楼',loc:'重庆 · 渝中',desc:'轻轨从19层高的居民楼中间穿过——不是特效，是重庆人的日常。站在观景台上仰望，列车像一只穿山甲钻进水泥森林。这一站的设计曾经被全世界媒体报道，但对住在这栋楼里的居民来说，不过是每天回家的方式。',tag:'奇观',h:220},{title:'十八梯老街',loc:'重庆 · 渝中',desc:'从上半城到下半城的垂直通道，层层叠叠的石阶记录着老重庆的烟火人间。改造后的老街在保留记忆的同时长出了新的生命力——咖啡馆开在老茶馆隔壁，独立书店的橱窗对着卖手工辣椒面的摊位，新旧在此温柔交融。',tag:'老街',h:195},{title:'大熊猫繁育基地',loc:'成都 · 成华区',desc:'早上九点熊猫们正在享用早餐。幼年熊猫在树上打闹，圆滚滚的身子挂在枝头晃悠。这是成都最治愈的早晨，没有之一。看着它们慢悠悠地啃竹子、在草地上打滚，你会忘记所有烦恼——国宝的日常就是最好的心灵按摩。',tag:'经典',h:250},{title:'宽窄巷子',loc:'成都 · 青羊区',desc:'青砖灰瓦的四合院里藏着咖啡馆和手作坊。找一棵银杏树下的位置点一杯盖碗茶——成都的安逸都在这一盏茶里，时光可以慢到停滞。宽巷子热闹、窄巷子安静、井巷子文艺，三条巷子各有各的节奏，逛完正好一个下午。',tag:'慢生活',h:210},{title:'锦里古街',loc:'成都 · 武侯区',desc:'三国故里的灯火从不熄灭。红灯笼把整条街染成暖橙色，糖画、变脸、皮影戏——蜀地的热闹和诗意都揉在了一起，越夜越迷人。明清风格的木楼在灯光下格外温暖，戏台上的川剧高腔穿透夜空，游客和本地人挤在一起叫好。',tag:'夜游',h:190},{title:'三星堆博物馆',loc:'广汉 · 三星堆',desc:'青铜神树三米高、纵目面具半米宽——古蜀人用青铜铸造了一个外星文明般的奇幻世界。站在这些文物面前，三千年的距离被压缩成一声惊叹。没有人知道他们从哪里来，又去了哪里，只留下这些沉默的青铜在诉说一个失落文明的辉煌。',tag:'文明',h:230},{title:'人民公园',loc:'成都 · 青羊区',desc:'成都慢生活的原点。鹤鸣茶社里竹椅吱呀，盖碗茶热气氤氲，隔壁的相亲角热闹非凡。在这里坐一下午，你会明白什么叫来了就不想走。掏耳朵的师傅敲着金属夹子从身边走过，那清脆的叮当声是成都特有的背景音乐。',tag:'慢生活',h:200},{title:'武侯祠',loc:'成都 · 武侯区',desc:'三国迷的精神圣地。丞相祠堂何处寻，锦官城外柏森森。红墙夹道、古柏参天，出师表的文字在石碑上静静诉说着鞠躬尽瘁的故事。走在惠陵的神道上，两侧的石兽已经守望了千年，风吹过竹林的声音像是在背诵前后出师表。',tag:'三国',h:205},{title:'二郎山隧道',loc:'318国道 · 川藏线',desc:'穿过4176米长的隧道就像穿过一道任意门。进洞前还是四川盆地的湿润雾气，出洞后扑面而来的是高原的烈风与蓝天——欢迎来到川西。两侧的风景在一瞬间切换，从青山绿水到苍茫高原，大自然用一条隧道画了一条分界线。',tag:'自驾',h:195},{title:'甲居藏寨',loc:'丹巴 · 甘孜州',desc:'中国最美乡村不是说说而已。百余座藏式碉楼散落在山坡上，黄昏时分夕阳把整片山谷染成金红色，炊烟从每座碉楼顶升起——这是嘉绒藏族人写给大地的诗。春天梨花白如雪，秋天层林尽染，美得像一幅油画。',tag:'最美乡村',h:260},{title:'梭坡古碉群',loc:'丹巴 · 甘孜州',desc:'千年前的摩天大楼。高达30米的石砌古碉没有一根钢筋，全靠石块之间的咬合力屹立千年。站在碉楼下仰望，风穿过石缝的声音像来自唐朝的耳语。这些古碉是嘉绒藏族先民用来御敌和储存粮食的，每一座都藏着一个家族的兴衰故事。',tag:'历史',h:215},{title:'中路藏寨',loc:'丹巴 · 甘孜州',desc:'比甲居更隐秘的藏寨秘境。春天梨花如雪覆盖山谷，秋天层林尽染。这里的碉楼与经幡在晨雾中若隐若现，美得像一幅还没干透的水墨画。几乎没有游客，只有当地的藏族老人在村口晒太阳、转经筒，时光在这里是静止的。',tag:'藏寨',h:245},{title:'塔公草原',loc:'八美 · 甘孜州',desc:'海拔3500米的高原草甸，天地之间只有风声、牦牛和自己。雅拉雪山的雪顶在天际线静静伫立，经幡在风中猎猎作响，把祝福送往远方。躺在草地上看云卷云舒，高原的阳光温暖而不刺眼，时间在这一刻失去了意义。',tag:'草原',h:250},{title:'雅拉雪山',loc:'八美 · 甘孜州',desc:'蜀山之王的姐妹峰。日出时分第一缕阳光把雪峰染成玫红色，倒映在塔公草原的海子里。那一刻你会相信，山是有灵魂的。藏族人说雅拉是莲花生的化身，每年都有信徒从远方赶来转山祈福，绕着雪山一步一叩首。',tag:'雪山',h:220},{title:'木雅大寺',loc:'八美 · 甘孜州',desc:'高原上的信仰之地。金色的殿顶在蓝天白云下格外耀眼，绛红色的僧袍在白色佛塔间穿行。推开厚重的木门，酥油灯的微光里藏着千年的虔诚。寺院的辩经场上年轻僧人们的击掌声此起彼伏，那是在用身体和声音辩论佛法的真谛。',tag:'寺庙',h:200},{title:'塔公寺',loc:'八美 · 甘孜州',desc:'塔公草原上的千年古刹，红墙金顶在高原阳光下熠熠生辉。寺内供奉的释迦牟尼十二岁等身像，让这里成为川西藏族心中的圣地。清晨的诵经声从大殿里飘出，和草原上的风混在一起，即使听不懂经文也会被那种庄严肃穆感染。',tag:'寺庙',h:185},{title:'折多山垭口',loc:'康定 · 甘孜州',desc:'康巴第一关，海拔4298米。站在垭口回望来路，318国道像一条细细的丝带缠绕在群山中。经幡在狂风中翻飞，每飘动一次就是念了一遍经文。空气稀薄但清冽，每一次深呼吸都提醒你——你正站在离天空最近的地方。',tag:'自驾',h:230},{title:'康定古城',loc:'康定 · 甘孜州',desc:'跑马溜溜的山上，一朵溜溜的云。情歌的旋律渗进了古城的每一条石板路。折多河穿城而过，两岸的藏式木楼倒映在水中，是高原上最温柔的夜景。傍晚沿着河边散步，藏餐馆里飘出酥油茶的香气，街头艺人拉着弦子唱着古老的情歌。',tag:'古城',h:210},{title:'贡嘎雪山',loc:'甘孜州 · 蜀山之王',desc:'海拔7556米，四川最高峰。日出时分的日照金山是川西最壮丽的自然奇观——金色的阳光从峰顶缓缓向下流淌，整座雪山像被点燃了一样。这座山是登山者的终极梦想，登顶成功率不到30%，但对大多数人来说，远远看一眼已经足够铭记一生。',tag:'雪山',h:240},{title:'海螺沟冰川',loc:'泸定 · 甘孜州',desc:'低海拔现代冰川的奇迹。巨大的冰舌从贡嘎山脚一直伸入原始森林，冰与绿共存的奇观让人恍惚——这是在同一个星球上吗？乘坐缆车缓缓接近冰川，脚下是从亚热带到寒带的完整植被带谱，一小时之内穿越了四个季节。',tag:'自然',h:240},{title:'四姑娘山',loc:'阿坝 · 小金',desc:'四位冰雪女王并肩而立。双桥沟、长坪沟、海子沟——每一条沟都是一条通往仙境的走廊。秋天的彩林倒映在海子里，比油画还要不真实。幺妹峰海拔6250米是四姐妹中最美的，也是技术攀登的圣地，被称为东方的阿尔卑斯。',tag:'雪山',h:235},{title:'新都桥',loc:'康定 · 甘孜州',desc:'摄影家的天堂，不是景点却胜过景点。秋天杨树金黄、藏寨散落、光影交错，随便举起相机按下快门，就是一张明信片。这里是318国道上最美的10公里，清晨的薄雾缠绕在山腰，傍晚的炊烟从碉楼上升起，每一帧都是大片。',tag:'摄影天堂',h:225}];

const CLOSE_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),1800)}
function stagger(c){c.querySelectorAll('.fade-up:not(.in)').forEach((el,i)=>{setTimeout(()=>{el.style.transitionDelay='0s';el.classList.add('in')},i*28)})}
function animateStats(){
  // Stats now show directly — no count-up needed with hero image
}
function setupDiscoverReveal(){
  const obs=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('reveal');obs.unobserve(e.target)}})
  },{threshold:.15});
  document.querySelectorAll('.masonry-item:not(.reveal)').forEach(el=>obs.observe(el));
}
function isDesktop(){return window.matchMedia('(min-width:768px)').matches}

function getTodayIndex(){const now=new Date();const j8=new Date(2026,6,8);const diff=Math.floor((now-j8)/(1000*60*60*24));return Math.max(0,Math.min(11,diff))}
function getGreeting(){const h=new Date().getHours();if(h>=5&&h<12)return '早上好';if(h>=12&&h<14)return '中午好';if(h>=14&&h<18)return '下午好';return '晚上好'}

/* ═══════════════════════════════════════════
   MOUNTAIN SVG — real ridge line, no snow caps
   ═══════════════════════════════════════════ */
function makeMountainSVG(){
  const W=600,H=210,PAD=30,baseY=H-36;
  const pts=RT.map(r=>parseInt(r.a.replace(/,/g,'')));
  const maxA=3800;
  const xs=RT.map((_,i)=>PAD+(i/(RT.length-1))*(W-PAD*2));
  const ys=pts.map(v=>baseY-(v/maxA)*(baseY-18));

  // Smooth bezier ridge
  let areaD=`M${xs[0]},${baseY}`;
  let lineD=`M${xs[0]},${ys[0]}`;
  for(let i=0;i<xs.length-1;i++){
    const mx=(xs[i]+xs[i+1])/2;
    const c1x=xs[i]+(xs[i+1]-xs[i])*.4;
    const c1y=ys[i]+(ys[i+1]-ys[i])*-.15;
    const c2x=xs[i]+(xs[i+1]-xs[i])*.6;
    const c2y=ys[i]+(ys[i+1]-ys[i])*1.15;
    areaD+=` C${c1x},${c1y} ${c2x},${c2y} ${xs[i+1]},${ys[i+1]}`;
    lineD+=` C${c1x},${c1y} ${c2x},${c2y} ${xs[i+1]},${ys[i+1]}`;
  }
  areaD+=` L${xs[xs.length-1]},${baseY} Z`;

  // Altitude labels
  let altLabels='';
  xs.forEach((x,i)=>{altLabels+=`<text x="${x}" y="${ys[i]-12}" class="mtn-alt">${RT[i].a}</text>`});

  // Peak dots
  let dots='';
  xs.forEach((x,i)=>{dots+=`<circle cx="${x}" cy="${ys[i]}" r="3.5" fill="var(--warm)"/>`});

  // Names at bottom
  let labels='';
  xs.forEach((x,i)=>{labels+=`<text x="${x}" y="${H-8}" class="mtn-label">${RT[i].n}</text>`});

  return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><path d="${areaD}" class="mtn-fill"/><path d="${lineD}" class="mtn-line"/>${dots}${altLabels}${labels}</svg>`;
}function renderHome(){
  const ti=getTodayIndex();
  const today=DAYS[ti];
  const greeting=getGreeting();

  // Set body bg to bg color only (no photo — hero image handles the photo)
  document.body.style.removeProperty('--bg-img');

  const R=5,orbR=38;
  let stones='';PR.forEach((p,i)=>{const angle=(i/R)*2*Math.PI-Math.PI/2;const l=50+orbR*Math.cos(angle),t=50+orbR*Math.sin(angle);stones+=`<div class="orbit-stone" data-pi="${i}" style="left:${l}%;top:${t}%">${p.t}</div>`});

  return `
    <div class="hero-img-wrap fade-up">
      ${DIMG[ti].toHTML(today.title,'')}
      <div class="hero-gradient"></div>
    </div>
    <div class="home-hero fade-up">
      <span class="hh-greeting">${greeting}</span>
      <h1 class="hh-location glitch" data-text="${today.title}">${today.title}</h1>
      <div class="hh-capsule">${today.date} · ${today.w}</div>
    </div>

    <div class="quick-stats quick-stats-card fade-up">
      <div class="quick-stat"><div class="qs-val">12</div><div class="qs-label">天旅程</div></div>
      <div class="quick-stat"><div class="qs-val">3,500<span style="font-size:14px;font-weight:400">m</span></div><div class="qs-label">最高海拔</div></div>
      <div class="quick-stat"><div class="qs-val">5</div><div class="qs-label">次住宿</div></div>
    </div>

    <div class="orbit-wrap orbit-card fade-up">
      <div class="ow-header"><h3>旅行原则</h3><p>点击石子 · 拖动旋转</p></div>
      <div class="orbit-stage" id="orbitStage">
        <div class="orbit-guide"></div>
        <div class="orbit-track" id="orbitTrack">${stones}</div>
        <div class="orbit-desc"><div class="od-text" id="odText"><div class="od-word"></div><div class="od-detail"></div></div></div>
      </div>
    </div>

    <div class="route-explorer route-card fade-up">
      <div class="rx-header"><h3>路线</h3><span>海拔一览</span></div>
      <div class="mtn-chart-wrap">${makeMountainSVG()}</div>
    </div>`;
}function renderTrip(){
  const DOW=['一','二','三','四','五','六','日'];
  const july1Dow=2, tripStart=8, tripEnd=19;
  let dowRow=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  let cells='';
  for(let i=0;i<july1Dow;i++) cells+='<div class="cal-cell hidden-cell"></div>';
  for(let d=1;d<=31;d++){
    const inTrip=d>=tripStart&&d<=tripEnd;
    if(inTrip){
      const dayIndex=d-tripStart;
      const dayData=DAYS[dayIndex];
      const dow=DOW[(july1Dow+d-1)%7];
      const movesHTML=dayData.moves.map(m=>`<span>${esc(m)}</span>`).join('');
      cells+=`<div class="cal-day fade-up" data-day="${dayIndex}">
        <span class="cd-num">${d}</span><span class="cd-wd">周${dow}</span>
        ${DIMG[dayIndex].toHTML(dayData.title,'cd-photo')}
        <div class="cd-detail">
          <div class="cdd-title">${esc(dayData.title)}</div>
          <div class="cdd-moves">${movesHTML}</div>
          <div class="cdd-meta">${esc(dayData.hotel)} · ${esc(dayData.alt)}</div>
          <button class="cd-collapse" data-collapse="${dayIndex}">收起 ▲</button>
        </div>
      </div>`;
    }else{
      cells+='<div class="cal-cell hidden-cell"></div>';
    }
  }
  return`<div class="cal-header"><h2>2026年7月</h2><p>川西环线 · 12天 · 点击日期展开详情</p></div><div class="cal-grid">${dowRow}${cells}</div>`;
}

function renderDiscover(){
  const shuffled=[...PLACES].sort(()=>Math.random()-0.5);
  let h='';
  shuffled.forEach(p=>{const realIdx=PLACES.indexOf(p);h+=`<div class="masonry-item fade-up" style="--h:${p.h||200}px" data-pi="${realIdx}">${PIMG[realIdx].toHTML(p.title,'')}<div class="mi-info"><div class="mi-title">${esc(p.title)}</div><div class="mi-desc">${esc(p.desc)}</div><span class="mi-tag">${esc(p.tag)}</span></div></div>`});
  return`<div class="disc-head"><h2>好去处</h2><p>${PLACES.length} 个心动时刻 · 随机排列</p></div><div class="masonry">${h}</div>`;
}

/* ═══════════════════════════════════════════
   TAB LOGIC
   ═══════════════════════════════════════════ */
let currentTab=null,expandedDay=null;

function movePill(name){
  // Only animate pill on mobile (floating tab bar)
  if(isDesktop())return;
  const btn=document.querySelector(`.tab-item[data-tab="${name}"]`),pill=$('#tabPill');
  if(!btn||!pill)return;
  pill.style.left=btn.offsetLeft+'px';
  pill.style.width=btn.offsetWidth+'px';
}

function switchTab(name){
  const old=$('.page.on'),np=$('#page-'+name);
  if(!np||old===np)return;
  $$('.tab-item').forEach(b=>b.classList.remove('active'));
  const nb=document.querySelector(`.tab-item[data-tab="${name}"]`);
  if(nb)nb.classList.add('active');
  movePill(name);
  if(old)old.classList.remove('on');
  np.classList.add('on');
  $('#mainContent').scrollTop=0;
  // Home page gets photo bg, others clear it
  if(name==='home'){}else{document.body.style.removeProperty('--bg-img');}
  currentTab=name;
  store('sctab3',name);
  requestAnimationFrame(()=>stagger(np));
}

function renderTab(name){
  if(name==='home'){$('#page-home').innerHTML=renderHome();setupOrbit()}
  else if(name==='trip')$('#page-trip').innerHTML=renderTrip();
  else if(name==='check'){$('#page-check').innerHTML=renderDiscover();requestAnimationFrame(()=>setupDiscoverReveal());requestAnimationFrame(()=>setupDiscoverReveal())}
  else if(name==='settings'){$('#page-settings').innerHTML=renderSettings();bindSettings();}
  switchTab(name);
}

/* ═══════════════════════════════════════════
   ORBIT (drag to rotate)
   ═══════════════════════════════════════════ */
let _orbitT=0,_orbitRAF=null,_orbitDragging=false,_orbitLastAngle=0;
function setupOrbit(){
  if(_orbitRAF){cancelAnimationFrame(_orbitRAF);_orbitRAF=null;}
  function tick(ts){
    _orbitT+=0.35;
    const track=document.querySelector('#orbitTrack');
    if(track)track.style.transform=`rotate(${_orbitT}deg)`;
    document.querySelectorAll('.orbit-stone').forEach(s=>{s.style.transform=`rotate(-${_orbitT}deg)`});
    _orbitRAF=requestAnimationFrame(tick);
  }
  _orbitRAF=requestAnimationFrame(tick);
  const stage=document.querySelector('#orbitStage');
  if(!stage)return;
  function pointerToAngle(e){
    const rect=stage.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    const px=e.clientX-cx, py=e.clientY-cy;
    return Math.atan2(py,px)*(180/Math.PI);
  }
  function onDown(e){
    _orbitDragging=true; _orbitLastAngle=pointerToAngle(e.touches?e.touches[0]:e);
    const track=document.querySelector('#orbitTrack');
    if(track)track.classList.add('paused');
    e.preventDefault();
  }
  function onMove(e){
    if(!_orbitDragging)return;
    const a=pointerToAngle(e.touches?e.touches[0]:e);
    _orbitT+=a-_orbitLastAngle;
    _orbitLastAngle=a;
    const track=document.querySelector('#orbitTrack');
    if(track)track.style.transform=`rotate(${_orbitT}deg)`;
    document.querySelectorAll('.orbit-stone').forEach(s=>{s.style.transform=`rotate(-${_orbitT}deg)`});
  }
  function onUp(){
    if(!_orbitDragging)return;
    _orbitDragging=false;
    const track=document.querySelector('#orbitTrack');
    if(track)track.classList.remove('paused');
  }
  stage.addEventListener('pointerdown',onDown);
  stage.addEventListener('pointermove',onMove);
  stage.addEventListener('pointerup',onUp);
  stage.addEventListener('pointerleave',onUp);
  stage.addEventListener('pointercancel',onUp);
}

function openDaySheet(dayIndex){
  const d=DAYS[dayIndex];if(!d)return;
  const sc=$('#sheetContent');
  let h=`<button class="sheet-close" id="sheetClose">${CLOSE_ICON}</button><div class="sheet-handle"></div>`;
  h+=`<div style="position:relative;width:100%;height:200px;overflow:hidden;background:var(--border);border-radius:var(--r-lg) var(--r-lg) 0 0">${DIMG[dayIndex].toHTML(d.title,'sheet-img')}</div>`;
  h+=`<div class="sheet-body"><span class="sh-chip">第 ${d.n} 天</span> <span style="font-size:11px;color:var(--t3);margin-left:6px">${d.w} · ${d.date}</span><h3>${esc(d.title)}</h3><div class="sh-desc">${esc(d.desc)}</div><div class="sh-tags">${d.moves.map(m=>`<span>${esc(m)}</span>`).join('')}</div><div class="sh-meta"><span>🏠 ${esc(d.hotel)}</span><span>⛰ ${esc(d.alt)}</span></div></div>`;
  sc.innerHTML=h;
  const cb=document.getElementById('sheetClose');if(cb)cb.addEventListener('click',closeSheet);
  $('#sheetOverlay').style.display='block';$('#sheetOverlay').style.animation='';
}

function openPostDetail(idx){
  const p=PLACES[idx];if(!p)return;
  const sc=$('#sheetContent');
  let h=`<button class="sheet-close" id="sheetClose">${CLOSE_ICON}</button>`;
  h+=`<div style="border-radius:var(--r-lg) var(--r-lg) 0 0;overflow:hidden">${PIMG[idx].toHTML(p.title,'sheet-img')}</div>`;
  h+=`<div class="sheet-body"><span class="sh-chip">${esc(p.tag)}</span> <span style="font-size:11px;color:var(--t3);margin-left:6px">${esc(p.loc)}</span><h3>${esc(p.title)}</h3><div class="sh-desc">${esc(p.desc)}</div></div>`;
  sc.innerHTML=h;
  const cb=document.getElementById('sheetClose');if(cb)cb.addEventListener('click',closeSheet);
  $('#sheetOverlay').style.display='block';$('#sheetOverlay').style.animation='';
}

function closeSheet(){
  const ov=$('#sheetOverlay');
  ov.style.animation='soOut .28s ease both';
  ov.addEventListener('animationend',()=>{ov.style.display='none';ov.style.animation=''},{once:true});
}

/* ═══════════════════════════════════════════
   CALENDAR INLINE EXPAND
   ═══════════════════════════════════════════ */
function expandCalDay(dayIndex){
  if(expandedDay===dayIndex){collapseCalDay();return}
  collapseCalDay();
  expandedDay=dayIndex;
  const el=document.querySelector(`.cal-day[data-day="${dayIndex}"]`);
  if(!el)return;
  el.classList.add('expanded','active');
  const cb=el.querySelector('.cd-collapse');
  if(cb)cb.addEventListener('click',e=>{e.stopPropagation();collapseCalDay()},{once:true});
}

function collapseCalDay(){
  if(expandedDay===null)return;
  const el=document.querySelector(`.cal-day[data-day="${expandedDay}"]`);
  if(el){
    el.classList.add('collapsing');
    el.classList.remove('active');
    el.addEventListener('transitionend',()=>{el.classList.remove('expanded','collapsing')},{once:true});
    // Force reflow to trigger transition
    el.offsetHeight;
    el.classList.remove('expanded');
  }
  expandedDay=null;
}

/* ═══════════════════════════════════════════
   APP NOTICE (shows every time)

function showAppNotice(){
  $('#appNotice').style.display='flex';

/* ═══════════════════════════════════════════
   SETTINGS BINDINGS
   ═══════════════════════════════════════════ */
function bindSettings(){
  $('#exportData')?.addEventListener('click',()=>{const data={days:DAYS,route:RT,principles:PR,places:PLACES};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chuanxi-trip-2026.json';a.click();toast('已导出')});
  $('#resetData')?.addEventListener('click',()=>{if(confirm('确定重置所有数据？')){try{localStorage.removeItem('scwelcomed3');localStorage.removeItem('sctab3');localStorage.removeItem('sctheme')}catch(e){}toast('已重置')}});
}

/* ═══════════════════════════════════════════
   EVENTS + INIT
   ═══════════════════════════════════════════ */
function enterApp(){
  $('#welcome').classList.add('hide');
  $('#tabBar').classList.add('show');
  $('#mainContent').classList.add('on');
  store('scwelcomed3','1');
  renderTab('home');
  setTimeout(showAppNotice,800);
}

function setup(){
  $$('.tab-item').forEach(b=>{b.addEventListener('click',()=>{if(b.dataset.tab!==currentTab)renderTab(b.dataset.tab)})});
  $('#enterBtn').addEventListener('click',enterApp);
  $('#sheetOverlay').addEventListener('click',e=>{if(e.target===$('#sheetOverlay'))closeSheet()});
  $('#appNotice').addEventListener('click',e=>{if(e.target===$('#appNotice'))$('#appNotice').style.display='none'});

  // Click delegation
  document.addEventListener('click',e=>{
    // Today strip → open day sheet
    // today-strip removed
    // Calendar day → expand
    const cd=e.target.closest('.cal-day');if(cd&&cd.dataset.day!==undefined&&!e.target.closest('.cd-collapse')){expandCalDay(parseInt(cd.dataset.day));return}
    // Discover card → open detail
    const mi=e.target.closest('.masonry-item');if(mi&&mi.dataset.pi!==undefined){openPostDetail(parseInt(mi.dataset.pi));return}
    // Orbit stone → show principle
    const ost=e.target.closest('.orbit-stone');if(ost&&ost.dataset.pi!==undefined){const p=PR[parseInt(ost.dataset.pi)];$$('.orbit-stone').forEach(s=>s.classList.remove('active','pop'));ost.classList.add('active','pop');ost.addEventListener('animationend',()=>ost.classList.remove('pop'),{once:true});const od=$('#odText');if(od){od.querySelector('.od-word').textContent=p.t;od.querySelector('.od-detail').textContent=p.d;od.classList.add('show')}return}
    // Click away from orbit → deselect
    if(!e.target.closest('.orbit-stone')&&!e.target.closest('#orbitStage')){$$('.orbit-stone').forEach(s=>s.classList.remove('active'));const od=$('#odText');if(od)od.classList.remove('show')}
  });

  // Handle resize for sidebar → pill transition
  window.addEventListener('resize',()=>{
    if(currentTab)movePill(currentTab);
  });
}

function forcePWA(){
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if(isStandalone||isDesktop())return;
  if(document.getElementById('pwaForce'))return;
  const ov=document.createElement('div');
  ov.id='pwaForce';
  ov.innerHTML=`<div class="pf-card"><div class="pf-icon"><img src="images/icon-180.png" width="56" height="56" alt=""></div><h2>请先添加到主屏幕</h2><p style="font-size:13px;color:var(--t2);line-height:1.6">为获得最佳体验，请将本页面<br>添加至手机主屏幕后打开</p><div class="pf-steps"><div class="pf-step"><span class="pf-num">1</span><span>点击 Safari 底部的 <strong>分享</strong> 按钮</span></div><div class="pf-step"><span class="pf-num">2</span><span>滑动找到 <strong>添加到主屏幕</strong></span></div><div class="pf-step"><span class="pf-num">3</span><span>点击右上角 <strong>添加</strong></span></div></div><button class="pf-continue" id="pfSkip">继续在浏览器中查看</button></div>`;
  document.body.appendChild(ov);
  document.getElementById('pfSkip').addEventListener('click',()=>{ov.style.display='none'});
}

function init(){
  // Service Worker — ensures updates on home screen apps
  if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=56').catch(()=>{});}
  // Pre-render all pages
  $('#page-home').innerHTML=renderHome();setupOrbit();
  $('#page-trip').innerHTML=renderTrip();
  $('#page-check').innerHTML=renderDiscover();requestAnimationFrame(()=>setupDiscoverReveal());
  $('#page-settings').innerHTML=renderSettings();

  setup();bindSettings();setupOrbit();

  const showed=store('scwelcomed3');
  if(showed){
    $('#welcome').classList.add('hide');
    $('#tabBar').classList.add('show');
    $('#mainContent').classList.add('on');
    const tab=store('sctab3')||'home';
    $$('.tab-item').forEach(b=>{if(b.dataset.tab===tab)b.classList.add('active')});
    currentTab=tab;
    if(tab==='home')
    switchTab(tab);
    movePill(tab);
    setTimeout(showAppNotice,800);
  }

  setTimeout(()=>{
    $('#splash').classList.add('hide');
    setTimeout(()=>{
      const s=$('#splash');if(s)s.style.display='none';
      if(!showed)$('#wPanel').classList.add('visible');
      document.querySelectorAll('.fade-up').forEach(el=>{const r=el.getBoundingClientRect();if(r.top<window.innerHeight)el.classList.add('in')});
      forcePWA();
    },500);
  },1800);
}

document.addEventListener('DOMContentLoaded',init);
</script>
